<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <!-- Meta tag essencial para o site se adaptar ao tamanho da tela do celular -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Baixador Multimídia Responsivo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* Garante que o fundo ocupe 100% da tela e centralize o conteúdo em qualquer resolução */
        body { 
            background: linear-gradient(135deg, #0f172a, #1e293b); 
            color: #f8fafc; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px;
        }
        
        /* Caixa principal adaptável: usa porcentagem para telas pequenas e limite máximo para telas grandes */
        .container { 
            background: #1e293b; 
            border: 1px solid #334155; 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); 
            text-align: center; 
            width: 100%;
            max-width: 480px; /* Não passa disso no computador */
            margin: auto;
        }
        
        h2 { font-size: 24px; margin-bottom: 10px; color: #38bdf8; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
        
        /* Input totalmente responsivo */
        input[type="text"] { 
            width: 100%; 
            padding: 14px; 
            background: #0f172a; 
            border: 1px solid #475569; 
            border-radius: 8px; 
            color: #fff; 
            font-size: 15px; 
            margin-bottom: 15px; 
            transition: border 0.2s; 
        }
        input[type="text"]:focus { border-color: #38bdf8; outline: none; }
        
        button.btn-main { 
            background: #0284c7; 
            color: white; 
            border: none; 
            padding: 14px; 
            border-radius: 8px; 
            cursor: pointer; 
            width: 100%; 
            font-size: 16px; 
            font-weight: 600; 
            transition: background 0.2s; 
        }
        button.btn-main:hover { background: #0369a1; }
        
        .loading { display: none; margin-top: 15px; color: #38bdf8; font-size: 14px; }
        .error { display: none; margin-top: 15px; color: #ef4444; font-size: 14px; }
        
        /* Container da prévia se ajusta ao tamanho do bloco pai */
        .video-container { display: none; margin-top: 25px; border-top: 1px solid #334155; padding-top: 20px; width: 100%; }
        
        /* O player de vídeo vai diminuir e crescer junto com a tela do aparelho */
        video { 
            width: 100%; 
            max-width: 100%; 
            height: auto; 
            border-radius: 8px; 
            border: 1px solid #475569; 
            background: #0f172a; 
            margin-bottom: 20px; 
        }
        
        .download-box { display: flex; flex-direction: column; gap: 10px; align-items: center; width: 100%; }
        
        /* Botões de download ocupam toda a largura disponível de forma flexível */
        .btn-download { 
            display: block; 
            color: white; 
            text-align: center; 
            padding: 14px; 
            border-radius: 8px; 
            font-size: 15px; 
            font-weight: 600; 
            transition: opacity 0.2s; 
            width: 100%; 
            box-sizing: border-box; 
            cursor: pointer; 
            border: none; 
        }
        .btn-download:hover { opacity: 0.9; }
        .mp4 { background: #2563eb; }
        .mp3 { background: #7c3aed; }
        
        .status-msg { display: none; margin-top: 15px; color: #e2e8f0; font-size: 13px; font-style: italic; }

        /* REGRAS ESPECÍFICAS PARA CELULARES (Telas pequenas) */
        @media (max-width: 480px) {
            body { padding: 10px; }
            .container { padding: 20px; border-radius: 12px; }
            h2 { font-size: 20px; }
            input[type="text"], button.btn-main, .btn-download { padding: 12px; font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Visualizador & Downloader</h2>
        <p>Insira o link público do Instagram, Facebook ou TikTok</p>
        
        <form id="videoForm">
            <input type="text" id="videoUrl" placeholder="Cole o link aqui (https://...)" required>
            <button type="submit" class="btn-main">Gerar Download</button>
        </form>
        
        <div class="loading" id="loadingText">Buscando prévia do vídeo... Aguarde.</div>
        <div class="error" id="errorText"></div>

        <div class="video-container" id="videoWrapper">
            <p style="margin-bottom: 10px; color: #38bdf8;">Prévia do Vídeo Encontrado:</p>
            <video id="videoPlayer" controls autoplay muted></video>
            
            <div class="download-box">
                <p style="color: #94a3b8; font-size: 14px; margin-bottom: 5px;">Como deseja salvar o arquivo?</p>
                
                <form action="/download-real" method="POST" style="width:100%;">
                    <input type="hidden" name="url" class="hidden-url">
                    <input type="hidden" name="tipo" value="mp4">
                    <button type="submit" class="btn-download mp4">Baixar em Vídeo (MP4)</button>
                </form>

                <form action="/download-real" method="POST" style="width:100%;">
                    <input type="hidden" name="url" class="hidden-url">
                    <input type="hidden" name="tipo" value="mp3">
                    <button type="submit" class="btn-download mp3">Baixar em Áudio (MP3)</button>
                </form>
                
                <div class="status-msg" id="statusTxt">Preparando arquivo... O download iniciará em instantes.</div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('videoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const urlInput = document.getElementById('videoUrl').value;
            
            const loadingText = document.getElementById('loadingText');
            const errorText = document.getElementById('errorText');
            const videoWrapper = document.getElementById('videoWrapper');
            const videoPlayer = document.getElementById('videoPlayer');

            loadingText.style.display = 'block';
            errorText.style.display = 'none';
            videoWrapper.style.display = 'none';
            document.getElementById('statusTxt').style.display = 'none';

            try {
                const formData = new FormData();
                formData.append('url', urlInput);

                const response = await fetch('/analisar', { method: 'POST', body: formData });
                const data = await response.json();

                if (!response.ok) throw new Error(data.detail || 'Erro ao carregar prévia.');

                videoPlayer.src = data.media_url;
                
                document.querySelectorAll('.hidden-url').forEach(input => {
                    input.value = urlInput;
                });

                videoWrapper.style.display = 'block';
            } catch (err) {
                errorText.innerText = err.message;
                errorText.style.display = 'block';
            } finally {
                loadingText.style.display = 'none';
            }
        });
    </script>
</body>
</html>
