<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Baixador Universal Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #0f172a, #1e293b); color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: #1e293b; border: 1px solid #334155; padding: 30px; border-radius: 16px; width: 100%; max-width: 480px; margin: auto; text-align: center; }
        h2 { font-size: 24px; margin-bottom: 10px; color: #38bdf8; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
        input[type="text"] { width: 100%; padding: 14px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #fff; font-size: 15px; margin-bottom: 15px; text-align: center; }
        button.btn-main { background: #0284c7; color: white; border: none; padding: 14px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 16px; font-weight: 600; }
        .video-container { display: none; margin-top: 25px; border-top: 1px solid #334155; padding-top: 20px; width: 100%; }
        video { width: 100%; height: auto; max-height: 280px; border-radius: 8px; background: #0f172a; margin-bottom: 20px; }
        .download-box { display: flex; flex-direction: column; gap: 10px; width: 100%; }
        .btn-download { display: block; color: white; padding: 14px; border-radius: 8px; font-size: 15px; font-weight: 600; text-align: center; border: none; width: 100%; cursor: pointer; text-decoration: none; }
        .mp4 { background: #2563eb; }
        .mp3 { background: #7c3aed; }
        .status-msg, .loading { display: none; margin-top: 15px; color: #38bdf8; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Downloader Inteligente</h2>
        <p>Insira o link público do Instagram, Facebook ou TikTok</p>
        <form id="videoForm">
            <input type="text" id="videoUrl" placeholder="Cole o link aqui..." required>
            <button type="submit" class="btn-main">Gerar Download</button>
        </form>
        <div class="loading" id="loadingText">Buscando prévia do vídeo... Aguarde.</div>
        <div class="video-container" id="videoWrapper">
            <video id="videoPlayer" controls autoplay muted></video>
            <div class="download-box">
                <p style="color: #94a3b8; font-size: 14px; margin-bottom: 5px;">Como deseja salvar o arquivo?</p>
                <form action="/download-real" method="POST">
                    <input type="hidden" name="url" class="hidden-url">
                    <input type="hidden" name="tipo" value="mp4">
                    <button type="submit" class="btn-download mp4" onclick="mostrarAviso()">Baixar Vídeo (MP4)</button>
                </form>
                <form action="/download-real" method="POST">
                    <input type="hidden" name="url" class="hidden-url">
                    <input type="hidden" name="tipo" value="mp3">
                    <button type="submit" class="btn-download mp3" onclick="mostrarAviso()">Baixar Áudio (MP3)</button>
                </form>
                <div class="status-msg" id="statusTxt">Preparando arquivo... O download iniciará em instantes.</div>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('videoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const urlInput = document.getElementById('videoUrl').value;
            const loadingText = document.getElementById('loadingText');
            const videoWrapper = document.getElementById('videoWrapper');
            const videoPlayer = document.getElementById('videoPlayer');
            
            loadingText.style.display = 'block';
            videoWrapper.style.display = 'none';
            document.getElementById('statusTxt').style.display = 'none';
            
            try {
                const formData = new FormData();
                formData.append('url', urlInput);
                const response = await fetch('/analisar', { method: 'POST', body: formData });
                const data = await response.json();
                
                videoPlayer.src = data.media_url;
                document.querySelectorAll('.hidden-url').forEach(input => input.value = urlInput);
                videoWrapper.style.display = 'block';
            } catch (err) {
                alert("Erro ao ler mídias deste link.");
            } finally {
                loadingText.style.display = 'none';
            }
        });
        function mostrarAviso() { document.getElementById('statusTxt').style.display = 'block'; }
    </script>
</body>
</html>
