<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Baixador Multimídia Profissional</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #0f172a, #1e293b); color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: #1e293b; border: 1px solid #334155; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); text-align: center; width: 100%; max-width: 480px; margin: auto; }
        h2 { font-size: 24px; margin-bottom: 10px; color: #38bdf8; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
        input[type="text"] { width: 100%; padding: 14px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #fff; font-size: 15px; margin-bottom: 15px; text-align: center; }
        input[type="text"]:focus { border-color: #38bdf8; outline: none; }
        button.btn-main { background: #0284c7; color: white; border: none; padding: 14px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 16px; font-weight: 600; transition: background 0.2s; }
        button.btn-main:hover { background: #0369a1; }
        .loading { display: none; margin-top: 15px; color: #38bdf8; font-size: 14px; }
        .video-container { display: none; margin-top: 25px; border-top: 1px solid #334155; padding-top: 20px; width: 100%; }
        video { width: 100%; height: auto; max-height: 300px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; margin-bottom: 20px; }
        .download-box { display: flex; flex-direction: column; gap: 10px; width: 100%; }
        .btn-download { display: block; color: white; text-align: center; text-decoration: none; padding: 14px; border-radius: 8px; font-size: 15px; font-weight: 600; transition: opacity 0.2s; width: 100%; border: none; cursor: pointer; }
        .btn-download:hover { opacity: 0.9; }
        .mp4 { background: #2563eb; }
        .mp3 { background: #7c3aed; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Visualizador & Downloader</h2>
        <p>Baixe vídeos e áudios do Instagram, Facebook ou TikTok</p>
        
        <form id="videoForm">
            <input type="text" id="videoUrl" placeholder="Cole o link público aqui..." required>
            <button type="submit" class="btn-main">Gerar Download</button>
        </form>
        
        <div class="loading" id="loadingText">Analisando link... Aguarde alguns segundos.</div>

        <div class="video-container" id="videoWrapper">
            <p style="margin-bottom: 10px; color: #38bdf8; font-size: 14px;">Prévia do Vídeo Carregado:</p>
            <video id="videoPlayer" controls autoplay muted></video>
            
            <div class="download-box">
                <p style="color: #94a3b8; font-size: 14px; margin-bottom: 5px;">Escolha o formato para salvar:</p>
                <!-- Botões que acionam o download direto no navegador, contornando travas de servidor -->
                <a href="#" id="downloadMp4" class="btn-download mp4" target="_blank" download="video.mp4">Baixar em Vídeo (MP4)</a>
                <a href="#" id="downloadMp3" class="btn-download mp3" target="_blank" download="audio.mp3">Baixar apenas Áudio (MP3)</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('videoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const urlInput = document.getElementById('videoUrl').value;
            const loadingText = document.getElementById('loadingText');
            const videoWrapper = document.getElementById('videoWrapper');
            const videoPlayer = document.getElementById('videoPlayer');
            const downloadMp4 = document.getElementById('downloadMp4');
            const downloadMp3 = document.getElementById('downloadMp3');

            loadingText.style.display = 'block';
            videoWrapper.style.display = 'none';

            try {
                const formData = new FormData();
                formData.append('url', urlInput);

                const response = await fetch('/analisar', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error("Não foi possível processar o link. Verifique se ele é público.");
                }

                const data = await response.json();

                if (data.success) {
                    // Alimenta o player do corpo do site
                    videoPlayer.src = data.video_url;
                    
                    // Alimenta os botões de download com o link direto gerado
                    downloadMp4.href = data.video_url;
                    downloadMp3.href = data.audio_url;

                    // Mostra o bloco na tela
                    videoWrapper.style.display = 'block';
                } else {
                    throw new Error();
                }
            } catch (err) {
                alert(err.message || "Ocorreu um erro ao processar este link. Tente outro post público.");
            } finally {
                loadingText.style.display = 'none';
            }
        });
    </script>
</body>
</html>
